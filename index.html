<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Deployer - Zip to GitHub Pages</title>
    <!-- Library JSZip dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Canvas untuk partikel background -->
    <canvas id="particles-bg"></canvas>

    <div class="wrapper">
        <!-- Panel Deploy -->
        <div class="container mb-20">
            <h2>🚀 Web Deployer</h2>
            
            <div class="input-group">
                <label>Personal Access Token (PAT):</label>
                <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxx">
                <div class="note">Centang scope "repo" & "delete_repo" di GitHub.</div>
            </div>

            <div class="input-group">
                <label>Nama Repository Baru:</label>
                <input type="text" id="repoName" placeholder="contoh: testing-oauth">
            </div>

            <div class="input-group">
                <label>Upload File Web (.zip):</label>
                <input type="file" id="zipFile" accept=".zip">
                <div class="note">Pastikan file index.html ada di luar folder dalam ZIP.</div>
            </div>

            <div class="input-group checkbox-group">
                <input type="checkbox" id="autoKill" checked>
                <label for="autoKill">Suntikkan script "Auto-Mati setelah 24 Jam"</label>
            </div>

            <button id="deployBtn" class="btn-primary">
                <span class="btn-text">Jalankan Deploy!</span>
                <span class="loader" style="display:none;"></span>
            </button>
        </div>

        <!-- Panel Hapus Project -->
        <div class="container container-danger">
            <h2 class="text-danger">🗑️ Hentikan Project</h2>
            <div class="note danger-note" style="margin-bottom: 15px; text-align: center;">
                Menghapus project dari akun GitHub dan mematikan URL aktif seketika.
            </div>
            
            <button id="deleteBtn" class="btn-danger">
                <span class="btn-text">Hapus Repository Ini Sekarang</span>
                <span class="loader" style="display:none; border-bottom-color: white;"></span>
            </button>
        </div>

        <!-- Terminal Log -->
        <div class="container" style="padding: 15px; margin-top: 20px; display: none;" id="logContainer">
            <div id="logArea"></div>
        </div>
    </div>
</body>
</html>
